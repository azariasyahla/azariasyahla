<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Syahla</title><desc id="desc">Animated text and a pastel butterfly on a transparent background.</desc>
<style>
.title{font:600 47px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#b65f91}.subtitle{font:500 19px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#876582}.wing{transform-origin:center;animation:flutter 2.6s ease-in-out infinite alternate}.left{transform-origin:400px 161px;animation:fl 1.8s ease-in-out infinite alternate}.right{transform-origin:400px 161px;animation:fr 1.8s ease-in-out infinite alternate}.spark{animation:glow 2s ease-in-out infinite alternate}@keyframes fl{to{transform:scaleX(.78) rotate(-5deg)}}@keyframes fr{to{transform:scaleX(.78) rotate(5deg)}}@keyframes glow{to{opacity:.25}}@media(prefers-color-scheme:dark){.title{fill:#f7b8dc}.subtitle{fill:#dcc2ee}}
</style>
<text x="400" y="75" text-anchor="middle" class="title">hi, i'm syahla</text>
<text x="400" y="107" text-anchor="middle" class="subtitle">data analyst · data scientist</text>
